<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeR-P</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>

  <header>
    <strong>TypeR-P</strong>
    <span id="status">Waiting for Photopea...</span>
  </header>

  <section class="panel">
    <label for="text">Text</label>

    <textarea
      id="text"
      placeholder="Type text here..."
    ></textarea>
  </section>

  <section class="panel">

    <label for="font">Font</label>

    <input
      id="font"
      type="text"
      value="ArialMT"
    >

    <div class="row">

      <div>
        <label for="size">Size</label>
        <input
          id="size"
          type="number"
          value="48"
          min="1"
        >
      </div>

      <div>
        <label for="color">Color</label>
        <input
          id="color"
          type="text"
          value="FF0000"
          maxlength="6"
        >
      </div>

    </div>

    <div class="row">

      <div>
        <label for="align">Alignment</label>

        <select id="align">
          <option value="LEFT">Left</option>
          <option value="CENTER" selected>Center</option>
          <option value="RIGHT">Right</option>
        </select>
      </div>

    </div>

  </section>

  <section class="actions">

    <button
      id="insert"
      class="primary"
    >
      INSERT TEXT
    </button>

  </section>

  <script>
    var s = document.createElement("script");
    s.src = "./src/main.js?v=999";
    s.onload = function () {
      document.getElementById("status").textContent = "MAIN.JS LOADED";
    };
    s.onerror = function () {
      document.getElementById("status").textContent = "MAIN.JS FAILED TO LOAD";
      alert("MAIN.JS FAILED TO LOAD");
    };
    document.body.appendChild(s);
  </script>

</body>
</html>
